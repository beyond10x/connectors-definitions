version: "3"

vars:
  TYPES: generated/schema/types/connectors_definitions.definition
  BUILD: .local/build

tasks:
  schema:
    desc: Project spec/ into generated/ as JSON Schema
    cmds:
      - ess specify validate --path spec
      - ess generate --path spec --kind schema --out generated

  check:
    desc: Validate spec/, check generated/ for drift, validate every definition, shared auth file and vendored source
    cmds:
      - ess specify validate --path spec
      - ess generate --path spec --kind schema --out generated --check
      - rm -rf {{.BUILD}} && mkdir -p {{.BUILD}}/schemas {{.BUILD}}/instances
      - |
        yq -o=json '. + {"$id": "urn:beyond10x:connectors-definition:1"}' {{.TYPES}}.ConnectorDefinition.schema.json > {{.BUILD}}/schemas/definition.schema.json
        yq -o=json '. + {"$id": "urn:beyond10x:connectors-auth:1"}' {{.TYPES}}.AuthLibrary.schema.json > {{.BUILD}}/schemas/auth.schema.json
      - |
        for f in connectors/*.yaml; do
          id=$(basename "$f" .yaml)
          sha=$(yq '.source.sha256' "$f"); src=$(yq '.source.openapi // .source.swagger // .source.discovery' "$f")
          test "$(gunzip -c "$src" | sha256sum | cut -d' ' -f1)" = "$sha" || { echo "$f: $src does not hash to $sha"; exit 1; }
          yq -o=json '.' "$f" > "{{.BUILD}}/instances/connector-$id.json"
        done
      - for f in auth/*.yaml; do yq -o=json '.' "$f" > "{{.BUILD}}/instances/auth-$(basename "$f" .yaml).json"; done
      - ess generate schema validate --schemas {{.BUILD}}/schemas {{.BUILD}}/instances

  release-check:
    desc: Refuse unless TAG is a bare version with a dated CHANGELOG.md entry
    silent: true
    requires:
      vars: [TAG]
    env:
      RELEASE_TAG: "{{.TAG}}"
    cmds:
      - cmd: |
          set -eu
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "release-check: tag '$RELEASE_TAG' is not a bare version such as 0.1.0" >&2
            exit 1
          fi
          if ! awk -v head="## [$RELEASE_TAG] - " 'index($0, head) == 1 && substr($0, length(head) + 1) ~ /^[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$/ { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "release-check: CHANGELOG.md has no '## [$RELEASE_TAG] - <date>' entry" >&2
            exit 1
          fi
          if ! awk -v head="[$RELEASE_TAG]: " 'index($0, head) == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "release-check: CHANGELOG.md has no '[$RELEASE_TAG]: <url>' link" >&2
            exit 1
          fi
          echo "release-check: $RELEASE_TAG has a dated CHANGELOG.md entry and link"
