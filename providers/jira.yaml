  license: Apache-2.0
  license_file: upstream/jira/LICENSE
base_url: https://{site}.atlassian.net
auth:
  - id: atlassian.basic
    purpose: service_account
    scheme: http_basic
    acquisition:
      flow: static_entry
    identity:
      path: /rest/api/3/myself
      subject_pointer: /accountId
    sources:
      - https://developer.atlassian.com/cloud/jira/platform/basic-auth-for-rest-apis/
operations:
  - id: issue.get
    effect: read
    description: Read one issue by id or key, with the fields named in fields and the expansions named in expand
    method: GET
    path: /rest/api/3/issue/{issueIdOrKey}
    parameters:
      - name: issueIdOrKey
        location: path
        required: true
        type: string
      - name: fields
        location: query
        required: false
        type: string
        repeated: true
      - name: fieldsByKeys
        location: query
        required: false
        type: boolean
      - name: expand
        location: query
        required: false
        type: string
      - name: properties
        location: query
        required: false
        type: string
        repeated: true
      - name: updateHistory
        location: query
        required: false
        type: boolean
      - name: failFast
        location: query
        required: false
        type: boolean
    operation_id: getIssue
  - id: issue.comments
    effect: read
    description: List one issue's comments, one page per call; the walk ends when startAt plus the page's comments reaches total
    method: GET
    path: /rest/api/3/issue/{issueIdOrKey}/comment
    parameters:
      - name: issueIdOrKey
        location: path
        required: true
        type: string
      - name: startAt
        location: query
        required: false
        type: integer
      - name: maxResults
        location: query
        required: false
        type: integer
      - name: orderBy
        location: query
        required: false
        type: string
      - name: expand
        location: query
        required: false
        type: string
    operation_id: getComments
  - id: issues.search
    effect: read
    description: Search issues by JQL, one page per call; the walk ends on a page without nextPageToken
    method: GET
    path: /rest/api/3/search/jql
    parameters:
      - name: jql
        location: query
        required: false
        type: string
      - name: nextPageToken
        location: query
        required: false
        type: string
      - name: maxResults
        location: query
        required: false
        type: integer
      - name: fields
        location: query
        required: false
        type: string
        repeated: true
      - name: expand
        location: query
        required: false
        type: string
      - name: properties
        location: query
        required: false
        type: string
        repeated: true
      - name: fieldsByKeys
        location: query
        required: false
        type: boolean
      - name: failFast
        location: query
        required: false
        type: boolean
      - name: reconcileIssues
        location: query
        required: false
        type: integer
        repeated: true
      - name: includeArchivedProjects
        location: query
        required: false
        type: boolean
    operation_id: searchAndReconsileIssuesUsingJql
