domain: connectors_definitions.definition
summary: One provider definition, providers/<id>.yaml. It names a vendored source and says which of its operations to expose and how; everything the source states is left to the lowerer.

types:
  - name: connectors_definitions.definition.SchemaId
    kind: enum
    variants: ["urn:beyond10x:connectors-definition:1"]
  - name: connectors_definitions.definition.Sha256Hex
    kind: newtype
    of: String
    alphabet: "0123456789abcdef"
  - name: connectors_definitions.definition.Source
    kind: struct
    fields:
      - {name: openapi, type: String}
      - {name: sha256, type: connectors_definitions.definition.Sha256Hex}
      - {name: amendments, type: "Optional<String>"}
  - name: connectors_definitions.definition.ConfigType
    kind: enum
    variants: [string]
  - name: connectors_definitions.definition.ConfigField
    kind: struct
    fields:
      - {name: type, type: connectors_definitions.definition.ConfigType}
      - {name: default, type: "Optional<String>"}
      - {name: values, type: "Optional<List<String>>"}
  - name: connectors_definitions.definition.AuthScheme
    kind: enum
    variants: [basic, bearer]
  - name: connectors_definitions.definition.Auth
    kind: struct
    fields:
      - {name: scheme, type: connectors_definitions.definition.AuthScheme}
  - name: connectors_definitions.definition.PagingStyle
    kind: struct
    fields:
      - {name: request, type: "Optional<String>"}
      - {name: next, type: "Optional<String>"}
      - {name: limit, type: "Optional<String>"}
      - {name: max, type: "Optional<Integer>"}
      - {name: total, type: "Optional<String>"}
      - {name: last, type: "Optional<String>"}
  - name: connectors_definitions.definition.Effect
    kind: enum
    variants: [read, write]
  - name: connectors_definitions.definition.Operation
    kind: struct
    fields:
      - {name: op, type: String}
      - {name: effect, type: "Optional<connectors_definitions.definition.Effect>"}
      - {name: description, type: "Optional<String>"}
      - {name: paging, type: "Optional<String>"}
  - name: connectors_definitions.definition.ProviderDefinition
    kind: struct
    fields:
      - {name: schema, type: connectors_definitions.definition.SchemaId}
      - {name: source, type: connectors_definitions.definition.Source}
      - {name: base_url, type: String}
      - {name: config, type: "Optional<Map<String, connectors_definitions.definition.ConfigField>>"}
      - {name: auth, type: "Map<String, connectors_definitions.definition.Auth>"}
      - {name: paging, type: "Optional<Map<String, connectors_definitions.definition.PagingStyle>>"}
      - {name: operations, type: "Map<String, connectors_definitions.definition.Operation>"}
