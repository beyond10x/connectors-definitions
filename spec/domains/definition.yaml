      - {name: datasources, type: "Optional<Map<String, connectors_definitions.definition.Datasource>>"}
      - {name: references, type: "Optional<Map<String, connectors_definitions.references.Reference>>"}
      - {name: views, type: "Optional<Map<String, connectors_definitions.references.View>>"}
