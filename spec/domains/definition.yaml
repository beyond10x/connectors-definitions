      - {name: query, type: "Optional<Map<String, String>>"}
  - name: connectors_definitions.definition.Auth
    kind: struct
    fields:
      - {name: use, type: "Optional<String>"}
      - {name: default, type: "Optional<Boolean>"}
      - {name: scheme, type: "Optional<connectors_definitions.definition.AuthScheme>"}
      - {name: header, type: "Optional<String>"}
      - {name: prefix, type: "Optional<String>"}
      - {name: label, type: "Optional<String>"}
      - {name: account_label, type: "Optional<String>"}
      - {name: identity, type: "Optional<connectors_definitions.definition.AuthIdentity>"}
      - {name: scopes, type: "Optional<connectors_definitions.definition.AuthScopes>"}
      - {name: access, type: "Optional<connectors_definitions.definition.AuthAccess>"}
      - {name: evidence_lifetime_ms, type: "Optional<Integer>"}
      - {name: token_url, type: "Optional<String>"}
      - {name: authorize_url, type: "Optional<String>"}
  - name: connectors_definitions.definition.AuthLibraryId
