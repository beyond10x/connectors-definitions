domain: connectors_definitions.definition
summary: "One connector definition, connectors/<id>.yaml. It names a vendored source and says which of its operations to expose and how; everything the source states is left to the lowerer. A source names exactly one of openapi, swagger and discovery, and a swagger or discovery source names its projection. Defaults hold fields an operation carries to the engine as written: each applies to every operation that does not set it, except envelope, which applies only to the reads that answer JSON (no response other than json, no download), and refusal_texts and custody, which apply only to writes. A write's body maps each key, a top-level name or a JSON pointer, to its type, string, integer, boolean, string_list or any: a string followed by + must not be empty, a trailing ! requires the key, and =<value> sends that value fixed. A feed's container cursor names exactly one of next, last and offset; url_parameter, only beside next, names the query parameter of the next URL that carries the continuation, and offset sends the index of a page's first record and ends on the answer for which complete holds. A feed's item position names exactly one of time, a query parameter that takes the time, and query, a jql or cql template whose first holds {container} once and no {since}, and resume holds {container} and {since} once each; a query is at minute precision, and the items name no container parameter. The position's time, query parameter and page parameter each name a query parameter the items operation takes. utc_offsets bounds, in minutes east of UTC from -1439 to 1439 and least not above greatest, the offset of the zone the provider reads {since} in, and needs page, the continuation within one read. An item's url, url_base and parent are JSON pointers. A read's query_fixed sends each named query parameter with that value on every request, and a caller cannot send it; query_folds names a caller input, not a parameter of the source, that is appended to the fixed value of into as one space, prefix and the input in format. embedded_text answers the file a JSON answer carries as base64 text: content, encoding and size are JSON pointers, encoding must read base64, and a file over max_bytes is refused. rate_limit_headers names the headers by which a 403 or 429 says the rate limit is spent: remaining at 0 makes it rate_limited, with the wait to the Unix time in reset; one that carries Retry-After is rate_limited whatever remaining says, and the wait Retry-After names is read before reset."

