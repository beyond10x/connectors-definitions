      - {name: pointer, type: "Optional<String>"}
      - {name: minimum, type: "Optional<List<String>>"}
      - {name: requested, type: "Optional<List<String>>"}
  - name: connectors_definitions.definition.AuthAccess
    kind: struct
    fields:
