name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: task check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install the pinned ess and task releases
        working-directory: ${{ runner.temp }}
        run: |
          ess="$(jq -r .ess "$GITHUB_WORKSPACE/toolchain.json")"
          archive="ess-$ess-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/beyond10x/ess/releases/download/$ess"
          curl -fsSLO "$base/$archive"
          curl -fsSL -o ess-SHA256SUMS "$base/SHA256SUMS"
          grep " $archive\$" ess-SHA256SUMS | sha256sum -c -
          tar -xzf "$archive"
          echo "$PWD/ess-$ess-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
          task="$(jq -r .task "$GITHUB_WORKSPACE/toolchain.json")"
          base="https://github.com/go-task/task/releases/download/$task"
          curl -fsSLO "$base/task_linux_amd64.tar.gz"
          curl -fsSLO "$base/task_checksums.txt"
          grep " task_linux_amd64.tar.gz\$" task_checksums.txt | sha256sum -c -
          mkdir task && tar -xzf task_linux_amd64.tar.gz -C task
          echo "$PWD/task" >> "$GITHUB_PATH"
      - run: yq --version
      - run: task check
